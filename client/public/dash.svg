<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" width="100%" height="100%">
  <rect width="1200" height="200" fill="#eef2f6" />
  <defs>
    <linearGradient id="equityGradLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b7a55" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#0b7a55" stop-opacity="0.02" />
    </linearGradient>
  </defs>
  <!-- Area fill under equity curve -->
  <path d="M 0,188 C 70,184 130,183 200,186 C 260,181 330,177 400,179 C 480,174 540,175 600,173 C 670,173 730,171 800,168 C 880,162 940,156 1000,148 C 1080,138 1140,126 1200,120 L 1200,200 L 0,200 Z" fill="url(#equityGradLight)" />
  <!-- Ultra-smooth, thin anti-aliased equity line -->
  <path d="M 0,188 C 70,184 130,183 200,186 C 260,181 330,177 400,179 C 480,174 540,175 600,173 C 670,173 730,171 800,168 C 880,162 940,156 1000,148 C 1080,138 1140,126 1200,120" fill="none" stroke="#0b7a55" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Top Tracking Subtitle -->
  <text x="600" y="52" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="4" fill="#64748b">YOUR TRADING LOG</text>
  <!-- Main Brand Title -->
  <text x="600" y="112" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" letter-spacing="-1">
    <tspan fill="#111827">Trade</tspan>
    <tspan fill="#0b7a55" dx="8">Journal</tspan>
  </text>
  <!-- Motivational Tagline -->
  <text x="600" y="152" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500" fill="#334155">Log every trade. Learn from every one.</text>
</svg>
